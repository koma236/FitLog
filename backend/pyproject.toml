[project]
name = "fitlog-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "Django>=5.2,<5.3",
  "djangorestframework>=3.18.3,<3.19",
  "psycopg[binary]>=3.2,<4",
  "Pillow>=13,<14",
  "gunicorn>=23,<26",
  "boto3>=1.36,<2",
]

[dependency-groups]
dev = [
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
  "django-stubs[compatible-mypy]>=5.2,<5.3",
  "djangorestframework-stubs>=3.16,<3.17",
  "pytest>=8.4,<9",
  "pytest-django>=4.11,<5",
  "jsonschema>=4.25,<5",
  "types-jsonschema>=4.25,<5",
  "boto3-stubs[s3,sts,rds,ecs,secretsmanager,cloudfront,elbv2]>=1.36,<2",
  "types-gunicorn",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
